name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate Gradle configuration
        run: ./gradlew --no-daemon tasks

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Read version
        id: version
        run: |
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "title=ColorBlendr ${name#v}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ColorBlendr-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          name: ${{ steps.version.outputs.title }}
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
